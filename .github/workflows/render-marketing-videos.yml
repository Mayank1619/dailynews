name: Render Marketing Videos

on:
  schedule:
    - cron: "45 10 * * *"
  workflow_dispatch:

jobs:
  render-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: codex/dark-theme-firebase-vercel-auth

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Render marketing videos
        run: npm run marketing:render-videos

      - name: Upload rendered videos
        uses: actions/upload-artifact@v4
        with:
          name: marketing-videos
          path: marketing-ops/generated-videos/
          if-no-files-found: error
